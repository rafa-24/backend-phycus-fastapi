[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phycus"
version = "0.1.0"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "sqlmodel>=0.0.39",
    "python-dotenv>=1.2.2",
    "pwdlib[argon2]>=0.3.0",
    "python-jose[cryptography]>=3.5.0",
    "jinja2>=3.1.6",
    "email-validator>=2.3.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "alembic>=1.18.5",
    "ddgs>=9.14.0"
]

[tool.setuptools.packages.find]
include = ["app*"]